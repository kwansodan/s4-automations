services:
  - type: web
    name: anr-laundry-billing-engine
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: INNGEST_APP_ID
        value: anr-laundry-billing
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORG_ID
        sync: false
      - key: ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.com
      - key: ZOHO_BOOKS_API_URL
        value: https://www.zohoapis.com/books/v3
      - key: CONTROL_SHEETS_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: NOTIFICATION_EMAIL
        value: cdanso@service4gh.com
