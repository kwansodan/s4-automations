version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - INNGEST_EVENT_KEY=dev-event-key
      - INNGEST_SIGNING_KEY=dev-signing-key
      - INNGEST_APP_ID=anr-laundry-billing
      - INNGEST_DEV_SERVER_URL=http://inngest:8288
      - ENVIRONMENT=development
      - MOCK_MODE=true
    env_file:
      - .env
    depends_on:
      - inngest

  inngest:
    image: inngest/inngest:latest
    ports:
      - "8288:8288"
    command: inngest dev -u http://app:8000/api/inngest
