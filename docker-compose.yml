services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1

  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    ports:
      - "${INNGEST_DEV_PORT:-8288}:8288"
    command: inngest dev -u http://app:8000/api/inngest
    profiles:
      - dev

